[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-permits"
version = "0.1.0"
description = "Pull building permits from Socrata open-data portals into clean, deduplicated CSV and Markdown."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hector Fuentes" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["open-data", "socrata", "building-permits", "csv", "civic-tech"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
open-permits = "open_permits.cli:main"

[project.urls]
Homepage = "https://github.com/HectorFuentes/open-permits"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
